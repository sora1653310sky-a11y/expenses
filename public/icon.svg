<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <g filter="url(#shadow)" transform="translate(106, 106) scale(0.585)">
    <!-- Baby Face & Head -->
    <circle cx="256" cy="256" r="190" fill="#ffffff"/>
    <circle cx="256" cy="256" r="180" fill="#fffbeb"/>
    <!-- Cute Ears -->
    <circle cx="70" cy="240" r="38" fill="#fde68a"/>
    <circle cx="442" cy="240" r="38" fill="#fde68a"/>
    <!-- Eyes -->
    <circle cx="180" cy="240" r="22" fill="#451a03"/>
    <circle cx="332" cy="240" r="22" fill="#451a03"/>
    <circle cx="186" cy="234" r="8" fill="#ffffff"/>
    <circle cx="338" cy="234" r="8" fill="#ffffff"/>
    <!-- Blushing cheeks -->
    <ellipse cx="150" cy="285" rx="26" ry="16" fill="#fca5a5" opacity="0.6"/>
    <ellipse cx="362" cy="285" rx="26" ry="16" fill="#fca5a5" opacity="0.6"/>
    <!-- Cute Pacifier / Smile -->
    <path d="M216 295 Q256 345 296 295" stroke="#b45309" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Little top curl hair -->
    <path d="M256 70 C240 30 280 20 270 65" stroke="#b45309" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Coins / Ledger icon in corner -->
    <circle cx="380" cy="380" r="70" fill="#d97706" stroke="#ffffff" stroke-width="10"/>
    <text x="380" y="405" font-family="-apple-system, sans-serif" font-size="75" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
